<svg width="280" height="50" viewBox="200 80 600 90" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;800&amp;display=swap');
      
      .mtm-text {
        font-family: 'Inter', sans-serif;
        font-weight: 800;
        font-size: 68px;
        letter-spacing: -1px;
        text-anchor: middle;
      }
      
      .logo-gradient {
        fill: url(#logoGradient);
      }
      
      .logo-line {
        stroke-dasharray: 500;
        stroke-dashoffset: 500;
        animation: drawLine 1.2s ease-out 0.3s forwards;
      }
      
      @keyframes drawLine {
        to {
          stroke-dashoffset: 0;
        }
      }
      
      /* Desativa o glow em telas pequenas e "reduzir animações" */
      @media (max-width: 768px), (prefers-reduced-motion: reduce) {
        .with-glow {
          filter: none !important;
        }
        .logo-line {
          animation: none;
          stroke-dashoffset: 0;
        }
      }
    </style>
    
    <!-- Gradiente principal alinhado com a paleta do site -->
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C7A7FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6EC8FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A8CFF;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow suave e elegante -->
    <filter id="subtleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur" />
      <feColorMatrix in="blur" type="matrix" result="glow"
        values="0 0 0 0 0.78
                0 0 0 0 0.65
                0 0 0 0 1.00
                0 0 0 0.4 0" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- TEXTO -->
  <text x="500" y="120" class="mtm-text logo-gradient with-glow" filter="url(#subtleGlow)">
    MARCUS T. MELO
  </text>
  
  <!-- LINHA DECORATIVA -->
  <line x1="250" y1="145" x2="750" y2="145" 
        class="logo-line"
        stroke="url(#logoGradient)" 
        stroke-width="2" 
        stroke-linecap="round"
        opacity="0.6" />
</svg>
