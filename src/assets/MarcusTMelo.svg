<svg width="1000" height="200" viewBox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap');

      .mtm-text {
        font-family: 'Montserrat', sans-serif;
        font-weight: 900;
        font-size: 72px;
        letter-spacing: 2px;
        text-anchor: middle;
      }

      /* ===== DARK MODE (default) ===== */
      /* A cor é aplicada como FILL (preenchimento) para o texto */
      .logo-color {
        fill: #CBA7FF; /* Lilás claro para fundo escuro */
      }

      /* ===== LIGHT MODE ===== */
      @media (prefers-color-scheme: light) {
        .logo-color {
          fill: #7B4FC9; /* Roxo mais escuro para fundo claro */
        }
      }
    </style>
    </defs>

  <text
    x="500"
    y="115"
    class="mtm-text logo-color"
  >
    MARCUS T. MELO
  </text>
  
  </svg>