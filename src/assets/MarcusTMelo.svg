<svg xmlns="http://www.w3.org/2000/svg" width="260" height="40" viewBox="0 0 600 80">
  <defs>
    <style type="text/css">
      .mtm-text {
        font-family: system-ui, -apple-system, sans-serif;
        font-weight: 900;
        font-size: 40px;
        letter-spacing: 4px;
        text-anchor: middle;
      }

      /* Dark mode (default) */
      .logo-color {
        fill: #CBA7FF;
      }

      /* Light mode */
      @media (prefers-color-scheme: light) {
        .logo-color {
          fill: #7B4FC9;
        }
      }
    </style>
  </defs>

  <!-- Text -->
  <text
    x="300"
    y="52"
    class="mtm-text logo-color"
  >
    MARCUS T. MELO
  </text>
</svg>