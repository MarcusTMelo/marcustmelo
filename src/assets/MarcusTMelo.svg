<svg width="1000" height="200" viewBox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Fonte -->
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&amp;display=swap');
      .mtm-text {
        font-family: 'Montserrat', sans-serif;
        font-weight: 900;
        font-size: 72px;
        letter-spacing: 2px;
        text-anchor: middle;
      }
    </style>

    <!-- Glow pulsando -->
    <filter id="neonPulse" x="-40%" y="-80%" width="180%" height="260%">
      <!-- Blur do glow -->
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur">
        <animate attributeName="stdDeviation"
                 values="2;4;2"
                 dur="1.6s"
                 repeatCount="indefinite" />
      </feGaussianBlur>

      <!-- Cor do brilho -->
      <feColorMatrix in="blur" type="matrix" result="glow"
        values="0 0 0 0 0.80
                0 0 0 0 0.65
                0 0 0 0 1.00
                0 0 0 0.80 0" />

      <!-- Mistura glow + original -->
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Preenchimento do texto -->
    <linearGradient id="textFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F3E4FF" />
      <stop offset="100%" stop-color="#CBA7FF" />
    </linearGradient>
  </defs>

  <!-- Texto principal -->
  <text
    x="500"
    y="95"
    class="mtm-text"
    fill="url(#textFill)"
    filter="url(#neonPulse)"
  >
    MARCUS T. MELO
  </text>

  <!-- Linha inferior -->
  <line
    x1="75"
    y1="140"
    x2="925"
    y2="140"
    stroke="#CBA7FF"
    stroke-width="8"
    stroke-linecap="round"
    filter="url(#neonPulse)"
  />
</svg>