<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" role="img" aria-label="Marcus T. Melo">
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap');

      .mtm-text {
        font-family: 'Montserrat', sans-serif;
        font-weight: 900;
        font-size: 72px;
        letter-spacing: 2px;
        text-anchor: middle;
      }

      /* ===== DARK MODE (default) ===== */
      .logo-color {
        fill: #CBA7FF;
        stroke: #CBA7FF;
      }

      /* ===== LIGHT MODE ===== */
      @media (prefers-color-scheme: light) {
        .logo-color {
          fill: #7B4FC9;
          stroke: #7B4FC9;
        }
      }
    </style>
  </defs>

  <!-- TEXTO -->
  <text
    x="500"
    y="95"
    class="mtm-text logo-color"
  >
    MARCUS T. MELO
  </text>

  <!-- LINHA -->
  <line
    x1="75"
    y1="145"
    x2="925"
    y2="145"
    stroke-width="10"
    stroke-linecap="round"
    class="logo-color"
  />
</svg>